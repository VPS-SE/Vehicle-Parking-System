[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
# WhiteNoise warns that STATIC_ROOT is missing; tests never run collectstatic.
filterwarnings = ["ignore:No directory at:UserWarning"]
# Browser and load tests run against a live server: ./run-system-tests.sh
addopts = "--ignore=tests/system"

[tool.coverage.run]
source = ["vps"]
branch = true
omit = ["*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint.per-file-ignores]
"vps/**/models.py" = ["RUF012"]
