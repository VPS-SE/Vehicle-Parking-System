{% extends "base.html" %}
{% block title %}Live occupancy · VPS{% endblock %}
{% block content %}
<h1>Live occupancy</h1>
<p>Free, reserved, occupied and blocked slots in each parking lot. This page updates every 30 seconds.</p>
<div id="occupancy"
     hx-get="{% url 'lots:occupancy' %}"
     hx-trigger="every 30s"
     hx-swap="innerHTML"
     aria-live="polite">
  {% include "lots/occupancy_table.html" %}
</div>
{% endblock %}
