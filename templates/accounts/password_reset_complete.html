{% extends "base.html" %}
{% block title %}Password Updated | Vehicle Parking System{% endblock %}
{% block content %}
<section class="auth-page auth-page--backdrop">
  <div class="aurora-backdrop" aria-hidden="true">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
    <div class="aurora-blob aurora-blob-3"></div>
    <div class="horizon-grid"></div>
  </div>
  <div class="auth-card">
    <h1>Password updated</h1>
    <p>Your password has been changed successfully.</p>
    <a href="{% url 'accounts:login' %}">Sign in with your new password</a>
  </div>
</section>
{% endblock %}
